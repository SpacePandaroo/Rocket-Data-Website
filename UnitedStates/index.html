<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>United States Spaceflight</title>

    <link rel="stylesheet" href="../styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script defer src="unitedstates.js"></script>

</head>


<body>

    <div class="page">

        <header class="header">

            <div class="brand">
                RocketLaunchHistory
            </div>

            <nav class="nav">

                <a href="../index.html">
                    Home
                </a>

                <a href="../worldrecords.html">
                    Records
                </a>

                <a href="../about.html">
                    About
                </a>

            </nav>

        </header>

        <main class="main">

            <h1 class="title">
                United States Spaceflight
            </h1>

            <section class="stats-row">

                <div class="card stat-card">

                    <h2>
                        Total Launch Count
                    </h2>

                    <p class="stat-number" id="total-count">
                        AWAITING API DATA
                    </p>

                </div>

                <div class="card stat-card">

                    <h2>
                        Previous Launches
                    </h2>

                    <ul class="launch-list" id="recent-launches">

                    </ul>

                </div>

            </section>

            <section class="records-grid" id="vehicle-families">

            </section>

        </main>

    </div>

    <!-- Vehicle Details Popup -->

    <div id="vehicle-modal" class="modal hidden">

        <div class="modal-content">

            <button id="close-modal">
                Close ×
            </button>

            <div id="modal-body">

            </div>

        </div>

    </div>

</body>

</html>
